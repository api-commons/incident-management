context: incident-management
name: Incident Management
intro: >-
  The common incident-management vocabulary -- incidents and the updates posted as they
  unfold, the services they affect, the on-call schedules and escalation policies that page
  people, the status pages that tell customers and the postmortems that follow -- distilled
  from the APIs that already exist.
tags: [Incident Management, Incident Response, On-Call, Alerting, Status Page, Status Pages, SRE, Site Reliability Engineering]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, limit, offset, more]

common_fields:
  id: [uuid, guid, object_id, record_id, incident_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, incident_status, current_status, lifecycle_status]
  name: [title, display_name, label, summary]
  description: [body, message, details, notes, note, summary_text]
  service_id: [service, services, service_ids, affected_services, component_id, components]
  team_id: [team, teams, team_ids]

concepts:
  incident:
    segments: [incidents, incident]
    aliases:
      severity: [severity_id, sev, priority, urgency, impact, level]
      number: [incident_number, reference, short_id, key]
      started_at: [started, triggered_at, detected_at, opened_at, start_time, began_at]
      acknowledged_at: [acked_at, acknowledged]
      resolved_at: [resolved, closed_at, ended_at, end_time, mitigated_at]
      commander_id: [commander, incident_commander, lead, owner_id, owner, assignee, assignees, assigned_to]
  incident_update:
    requires: [incident]
    path: /incidents/{incident_id}/updates
    segments: ["updates@incidents|incident", "timeline@incidents|incident", "log_entries@incidents", "notes@incidents|incident", "events@incidents|incident", incident_updates, incident-updates, timeline_events]
    aliases:
      body: [message, text, content, note, description]
      status: [new_status, state, incident_status]
      author_id: [author, user_id, created_by, agent]
  service:
    requires: [incident]
    segments: [services, service, components, component, business_services]
    aliases:
      escalation_policy_id: [escalation_policy, escalation_policies]
      owner_team_id: [team, teams, owner, owners]
  on_call_schedule:
    requires: [incident]
    segments: [schedules, schedule, oncalls, on-calls, on_calls, oncall, rotations, rotas, shifts@schedules]
    aliases:
      time_zone: [timezone, tz]
      layers: [rotations, schedule_layers, rules, final_schedule]
      users: [members, participants, user_ids, on_call_users]
  escalation_policy:
    requires: [incident]
    segments: [escalation_policies, escalation-policies, escalationpolicies, escalations, escalation_chains, escalation-chains, policies@escalation]
    aliases:
      rules: [escalation_rules, steps, levels, tiers]
      repeat: [num_loops, repeat_count, repeats]
  status_page:
    segments: [status_pages, status-pages, statuspages, pages@status|statuspage, statuses@pages]
    aliases:
      subdomain: [domain, url, custom_domain, page_url]
      components: [component_ids, services, monitors]
  # postmortem was measured and dropped: 3 providers, no shared property.

exclude:
  service:
    cyware: /rest-auth/components are the platform's own components

findings:
  - "An incident agrees on id, title, severity, status and created_at: PagerDuty, incident.io,
    FireHydrant and Opsgenie map 80-100% of it -- they share the shape of an outage."
  - "On-call schedules and escalation policies agree almost completely where they exist --
    name, description, time zone, rules -- and PagerDuty's shape is everyone's."
  - "Postmortems are barely published (3 providers): the retrospective lives in a document,
    not an API."
decisions:
  - "An ITSM incident (ServiceNow) is a ticket and stays in the help-desk context; an
    incident here is an operational one -- something is broken and people are paged."
  - "Security incidents from SOAR and XDR platforms are kept as incidents: same lifecycle,
    though their event timelines carry security context."
  - "Updates cover incident updates, timeline events, notes and log entries beneath an
    incident."
  - "Status-page components are services: the thing customers see as up or down."
  - "Schedules, on-calls and rotations are one concept, `on_call_schedule`."
